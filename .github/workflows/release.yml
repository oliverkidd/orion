name: Release

# Every push to main publishes a release, which is what the TUI footer's
# update indicator and `orion upgrade` look for.
#
# The version: Cargo.toml's [workspace.package] version is the floor. When no
# tag at or above it exists, that version ships as is. Otherwise the newest
# tag is bumped by what changed since it:
#   - minor (x.Y.0) when any DAEMON input changed — the paths listed in
#     crates/orion-daemon/daemon-inputs.txt, the same list build.rs hashes into
#     the daemon's build stamp. Upgrading across a minor release restarts the
#     daemon, and with it every session.
#   - patch (x.y.Z) otherwise: TUI and CLI only, so an upgrade reopens orion
#     and the running daemon keeps its sessions.
# A major release is a judgement call, never automatic: raise the floor in
# Cargo.toml to the next major (2.0.0) in the change that earns it. The stamped
# version is written into the build only, never committed back to main.
#
# Put `[skip release]` in the head commit message to push without releasing.
# Pushing a `v*` tag by hand still releases exactly that tag.

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Dry run: build the whole matrix on demand without publishing anything, so
  # a cross-compile break is caught before a release is cut.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: v
        run: |
          set -eu
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sed 's/^v//' | sort -V | tail -n1)
          if [ -z "$latest" ]; then
            next="$base"
          elif [ "$latest" != "$base" ] && [ "$(printf '%s\n%s\n' "$latest" "$base" | sort -V | tail -n1)" = "$base" ]; then
            next="$base"
          else
            inputs=$(grep -v '^#' crates/orion-daemon/daemon-inputs.txt | grep -v '^[[:space:]]*$')
            # shellcheck disable=SC2086 # one pathspec per line of the list
            if git diff --quiet "v$latest" HEAD -- $inputs; then
              next=$(echo "$latest" | awk -F. '{printf "%d.%d.%d", $1, $2, $3 + 1}')
            else
              next=$(echo "$latest" | awk -F. '{printf "%d.%d.0", $1, $2 + 1}')
            fi
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_EVENT_NAME}" = push ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          echo "next version: $next (latest tag: ${latest:-none}, Cargo.toml: $base)"

  build:
    name: build (${{ matrix.target }})
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      # Full history and tags: the build bakes in every release's notes
      # from git (crates/orion-tui/build.rs) for the What's new page.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Add rust target
        run: rustup target add ${{ matrix.target }}

      # Stamp the release version so the binary's CARGO_PKG_VERSION (what the
      # update check compares against) matches its tag.
      - name: Stamp version
        shell: bash
        run: |
          perl -0pi -e 's/(\[workspace\.package\]\nversion = ")[^"]*"/${1}${{ needs.version.outputs.version }}"/' Cargo.toml
          cargo update --workspace --offline || cargo update --workspace
          grep -A1 '^\[workspace.package\]' Cargo.toml

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: tar -czf orion-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release orion

      - uses: actions/upload-artifact@v4
        with:
          name: orion-${{ matrix.target }}
          path: orion-${{ matrix.target }}.tar.gz

  release:
    needs: [version, build]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: orion-*.tar.gz
          generate_release_notes: true
          make_latest: true
